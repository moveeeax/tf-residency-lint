name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The two supported Go releases; 1.26 matches the go directive in go.mod.
        go-version: ["1.26", "1.27"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}

      - name: Verify formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build
        run: go build -o /tmp/tf-residency-lint .

      - name: Smoke-test (inventory needs no ruleset → exit 0)
        run: /tmp/tf-residency-lint inventory --plan testdata/plan.json --stateful-only

      # The rulesets shipped in this repo are fictional examples. They must not
      # gate anybody's pipeline unless the operator explicitly opts in.
      - name: Smoke-test (example rulesets do not gate by default → exit 0)
        run: |
          /tmp/tf-residency-lint check \
            --plan testdata/plan.json \
            --config testdata/residency.yaml \
            --rulesets ./rulesets

      - name: Smoke-test (violations gate → exit 1)
        run: |
          if /tmp/tf-residency-lint check \
            --plan testdata/plan.json \
            --config testdata/residency.yaml \
            --rulesets ./rulesets \
            --allow-unpublished; then
            echo "expected a non-zero exit for a plan with residency violations" >&2
            exit 1
          fi

      - name: Smoke-test (JSON output is valid and carries the disclaimer)
        run: |
          /tmp/tf-residency-lint check \
            --plan testdata/plan.json \
            --config testdata/residency.yaml \
            --rulesets ./rulesets \
            --allow-unpublished --json > /tmp/report.json || true
          python3 - <<'PY'
          import json, sys
          doc = json.load(open("/tmp/report.json"))
          assert doc["tool"] == "tf-residency-lint", doc.get("tool")
          assert doc["disclaimer"], "report must carry the disclaimer"
          assert doc["result"]["findings"], "expected findings"
          for f in doc["result"]["findings"]:
              if f["rule"] == "residency-violation":
                  assert f["source_url"] and f["checked_on"], f
          PY

      - name: Smoke-test (SARIF and JUnit reports parse and carry the disclaimer)
        run: |
          for fmt in sarif junit; do
            /tmp/tf-residency-lint check \
              --plan testdata/plan.json \
              --config testdata/residency.yaml \
              --rulesets ./rulesets \
              --allow-unpublished --format "$fmt" > "/tmp/report.$fmt" || true
          done
          python3 - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          log = json.load(open("/tmp/report.sarif"))
          run = log["runs"][0]
          assert log["version"] == "2.1.0", log["version"]
          assert run["properties"]["disclaimer"], "SARIF must carry the disclaimer"
          assert any(r["level"] == "error" for r in run["results"]), "expected error results"
          root = ET.parse("/tmp/report.junit").getroot()
          assert root.tag == "testsuites", root.tag
          assert int(root.get("failures")) > 0, "expected failing testcases"
          PY

      - name: Smoke-test (plan policy denies a protected destroy → exit 1)
        run: |
          set +e
          /tmp/tf-residency-lint policy check \
            --plan testdata/policy/plan.json \
            --rules ./policies \
            --rules testdata/policy/exemptions.yaml \
            --format sarif > /tmp/policy.sarif
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "expected exit 1 for a plan that destroys a protected resource, got $code" >&2
            exit 1
          fi
          python3 - <<'PY'
          import json
          run = json.load(open("/tmp/policy.sarif"))["runs"][0]
          assert any(r["ruleId"] == "protected-destroy" and r["level"] == "error" for r in run["results"]), "expected a protected-destroy error"
          PY

      - name: Smoke-test (plan policy refuses a state file → exit 2)
        run: |
          set +e
          /tmp/tf-residency-lint policy check --plan testdata/state.json --rules ./policies
          code=$?
          set -e
          if [ "$code" -ne 2 ]; then
            echo "expected exit 2 for a state document, got $code" >&2
            exit 1
          fi

      # The example rulesets are not published, so the audit is expected to say
      # so. This step asserts the audit notices rather than staying quiet.
      - name: Smoke-test (ruleset audit flags unpublished research → exit 1)
        run: |
          if /tmp/tf-residency-lint rulesets validate --rulesets ./rulesets; then
            echo "expected a non-zero exit: the shipped rulesets are examples" >&2
            exit 1
          fi

      # A rule with no citation must stop the run, not be skipped.
      - name: Smoke-test (uncited ruleset is a hard error → exit 2)
        run: |
          set +e
          /tmp/tf-residency-lint rulesets validate --rulesets testdata/bad_rulesets
          code=$?
          set -e
          if [ "$code" -ne 2 ]; then
            echo "expected exit 2 for an uncited ruleset, got $code" >&2
            exit 1
          fi

      - name: Smoke-test (a non-plan JSON file is an error, never a pass)
        run: |
          echo '{"hello":"world"}' > /tmp/not-a-plan.json
          set +e
          /tmp/tf-residency-lint check \
            --plan /tmp/not-a-plan.json \
            --config testdata/residency.yaml \
            --rulesets ./rulesets
          code=$?
          set -e
          if [ "$code" -ne 2 ]; then
            echo "expected exit 2 for a document that is not terraform json, got $code" >&2
            exit 1
          fi
